<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="text-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg-gradient)"/>
  
  <!-- Decorative circles -->
  <circle cx="200" cy="150" r="100" fill="#06b6d4" opacity="0.1"/>
  <circle cx="1000" cy="480" r="120" fill="#3b82f6" opacity="0.1"/>
  
  <!-- Main content -->
  <g>
    <!-- Logo area -->
    <rect x="100" y="150" width="80" height="80" rx="10" fill="url(#text-gradient)"/>
    
    <!-- Title -->
    <text x="220" y="200" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="url(#text-gradient)">BOX</text>
    <text x="380" y="200" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="#e2e8f0">-tests</text>
    
    <!-- Tagline -->
    <text x="220" y="250" font-family="monospace" font-size="32" fill="#06b6d4" opacity="0.9">Infrastructure for Knowledge</text>
    
    <!-- Description -->
    <text x="100" y="340" font-family="Arial, sans-serif" font-size="28" fill="#94a3b8">Create, manage, and take tests with</text>
    <text x="100" y="380" font-family="Arial, sans-serif" font-size="28" fill="#94a3b8">blazing-fast local analytics</text>
    
    <!-- Features -->
    <text x="100" y="470" font-family="monospace" font-size="22" fill="#06b6d4">✓ 100% Local First</text>
    <text x="100" y="510" font-family="monospace" font-size="22" fill="#06b6d4">✓ Instant Statistics</text>
    <text x="100" y="550" font-family="monospace" font-size="22" fill="#06b6d4">✓ Unlimited Tests</text>
    
    <!-- Domain -->
    <text x="950" y="580" font-family="monospace" font-size="20" fill="#64748b" text-anchor="end">boxtests.com</text>
  </g>
</svg>
